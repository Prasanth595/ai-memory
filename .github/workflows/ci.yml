name: Candidate qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        type: choice
        required: true
        options: [markdown, atomic-download, percent-destination]
      base:
        type: string
        required: true
        default: "3334785675d8e56349107f68aef48a3ecbf4ada9"
      patch_base64:
        type: string
        required: true
      patch_sha256:
        type: string
        required: true
      tests_patch_base64:
        type: string
        required: true
      tests_patch_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ai-memory-qualification-${{ inputs.candidate }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  TAILWIND_BUILD: "1"
jobs:
  baseline:
    if: github.repository == 'rudycelekli/ai-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akitaonrails/ai-memory
          ref: 3334785675d8e56349107f68aef48a3ecbf4ada9
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: ai-native-1.95
      - name: Verify frozen base, reviewed paths and patch digest; apply working tree only
        env:
          CANDIDATE: ${{ inputs.candidate }}
          MODE: baseline
          BASE: ${{ inputs.base }}
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
          TESTS_PATCH_BASE64: ${{ inputs.tests_patch_base64 }}
          TESTS_PATCH_SHA256: ${{ inputs.tests_patch_sha256 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          EXPECTED = {'markdown': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/markdown.rs', 'docs/okf.md'], 'tests_paths': ['crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/markdown.rs'], 'candidate_sha256': '532499c7f04df69f458fc8931b99bd35a6e22873439c0b345294463551e71714', 'tests_sha256': 'f955747f2efe1672a03aff99a9c3b53b2ab3581e1d46cfc89e52b96c6dce08ff', 'candidate_bytes': 9036, 'tests_bytes': 4973}, 'atomic-download': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-cli/src/http_client.rs', 'crates/ai-memory-cli/tests/suite/main.rs', 'docs/okf.md', 'crates/ai-memory-cli/tests/suite/backup_download.rs'], 'tests_paths': ['crates/ai-memory-cli/tests/suite/main.rs', 'crates/ai-memory-cli/tests/suite/backup_download.rs'], 'candidate_sha256': 'd2090a61d6e893c118819d64e40a82ed6e1f9d9ec4d54acaf316f4bc870b9e32', 'tests_sha256': '756fbf69a8f122062e1f42d21510bbc05e99cf7fcb10664e9e40ab0f4718d5f4', 'candidate_bytes': 19648, 'tests_bytes': 11317}, 'percent-destination': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-web/src/markdown.rs', 'crates/ai-memory-web/tests/suite/routes.rs', 'crates/ai-memory-wiki/src/lib.rs', 'crates/ai-memory-wiki/src/markdown.rs', 'docs/okf.md', 'docs/security-boundaries.md'], 'tests_paths': ['crates/ai-memory-web/src/markdown.rs', 'crates/ai-memory-web/tests/suite/routes.rs', 'crates/ai-memory-wiki/src/markdown.rs'], 'candidate_sha256': 'a01699b282768ca820eca3e8623eb7cd7a3dd4eafe6984131b3295b9b3f9fa48', 'tests_sha256': '456e98a69c75512069a7bf477bb7d796bfd2475313e96b510dcce5d2a10047a4', 'candidate_bytes': 27225, 'tests_bytes': 8759}}
          name=os.environ['CANDIDATE']; mode=os.environ['MODE']; expected=EXPECTED[name]
          assert os.environ['BASE']==expected['base'], 'base input mismatch'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==expected['base'], 'checkout revision mismatch'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip(), 'checkout not clean'
          key='tests_sha256' if mode=='baseline' else 'candidate_sha256'
          supplied=os.environ['TESTS_PATCH_SHA256' if mode=='baseline' else 'PATCH_SHA256']
          encoded=os.environ['TESTS_PATCH_BASE64' if mode=='baseline' else 'PATCH_BASE64']
          assert supplied==expected[key], 'unreviewed patch digest'
          patch=base64.b64decode(encoded,validate=True)
          assert len(patch)<=65536 and hashlib.sha256(patch).hexdigest()==expected[key], 'patch integrity mismatch'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)
          f=root/'applied.patch';f.write_bytes(patch)
          stat=subprocess.check_output(['git','apply','--numstat',str(f)],text=True)
          paths=[line.split('\t',2)[2]for line in stat.splitlines()]
          allowed=expected['tests_paths' if mode=='baseline' else 'paths']
          assert paths and len(paths)==len(set(paths))and set(paths)==set(allowed), 'path allowlist mismatch'
          assert all(not pathlib.PurePosixPath(p).is_absolute()and '..'not in pathlib.PurePosixPath(p).parts for p in paths)
          subprocess.run(['git','apply','--check',str(f)],check=True)
          subprocess.run(['git','apply',str(f)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          metadata={'candidate':name,'mode':mode,'base':head,'patch_sha256':expected[key],'paths':paths,'source_commit_pushed':False,'platform':'ubuntu-latest','rust':'1.95','workflow_commit':os.environ['GITHUB_SHA']}
          (root/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Record native compiler and resource budget
        run: |
          rustc --version
          cargo --version
          rustc --version | grep '^rustc 1.95.'
          df -h .
      - name: Require actual baseline regression assertions (compile errors do not count)
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'
          name=os.environ['CANDIDATE']
          child_env={key:value for key,value in os.environ.items()if key not in {'GITHUB_TOKEN','GH_TOKEN'}and not key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}
          checks={
          'markdown':[
           ['cargo','test','--locked','-p','ai-memory-wiki','extract_links_handles_nested_and_escaped_labels','--','--nocapture'],
           ['cargo','test','--locked','-p','ai-memory-wiki','export_labels_keep_their_link_when_reindexed','--','--nocapture'],
           ['cargo','test','--locked','-p','ai-memory-mcp','export_okf_labels_preserve_links_when_the_bundle_is_reindexed','--','--nocapture']],
          'atomic-download':[
           ['cargo','test','--locked','-p','ai-memory-cli','--test','suite','backup_download::interrupted_archive_download_preserves_previous_output','--','--exact','--nocapture'],
           ['cargo','test','--locked','-p','ai-memory-cli','--test','suite','backup_download::interrupted_archive_download_leaves_no_partial_output','--','--exact','--nocapture']],
          'percent-destination':[
           ['cargo','test','--locked','-p','ai-memory-wiki','markdown_url_paths_decode_once_before_link_resolution','--','--nocapture'],
           ['cargo','test','--locked','-p','ai-memory-web','markdown_url_destinations_are_decoded_once_before_route_encoding','--','--nocapture'],
           ['cargo','test','--locked','-p','ai-memory-web','--lib','encoded_markdown_links_resolve_and_remain_in_the_source_scope','--','--nocapture']]}
          ATOMIC_ASSERTIONS={
           'backup_download::interrupted_archive_download_preserves_previous_output': 'assertion `left == right` failed',
           'backup_download::interrupted_archive_download_leaves_no_partial_output': 'failed download must not publish a partial archive',
          }
          def validate_baseline_result(candidate,cmd,returncode,log):
           assert returncode==101, 'baseline must fail with cargo test failure, not success or infrastructure exit'
           assert 'test result: FAILED' in log and 'panicked at' in log, 'expected native assertion failure missing'
           assert 'could not compile'not in log and 'error[E'not in log, 'compilation errors are not regression evidence'
           target=cmd[cmd.index('--')-1]
           assert target in log, 'requested regression was not reported'
           if candidate=='atomic-download':
            assert f"test {target} ... FAILED" in log, 'requested atomic regression did not fail'
            assert f"thread '{target}'" in log, 'requested atomic regression did not panic'
            assert ATOMIC_ASSERTIONS[target] in log, 'expected atomic assertion message missing'
           elif candidate=='percent-destination' and target=='markdown_url_destinations_are_decoded_once_before_route_encoding':
            assert 'test markdown::tests::'+target+' ... FAILED' in log, 'requested web regression did not fail'
            assert "thread 'markdown::tests::"+target+"'" in log, 'requested web regression did not panic'
            assert '<p><a href="w/default/scratch/p/notes/my%2520note.md#part">' in log, 'expected double-encoded output missing'
           else:
            assert 'assertion' in log, 'expected native assertion failure missing'
           return target
          results=[]
          for i,cmd in enumerate(checks[name]):
           result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=2100,env=child_env)
           log=result.stdout;(root/f'baseline-{i}.log').write_text(log);print(log)
           target=validate_baseline_result(name,cmd,result.returncode,log)
           results.append({'command':cmd,'exit':result.returncode,'assertion_failure':True})
          (root/'baseline-results.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.candidate }}-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-memory-qualification/
          if-no-files-found: error
          retention-days: 14
  candidate:
    if: github.repository == 'rudycelekli/ai-memory'
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akitaonrails/ai-memory
          ref: 3334785675d8e56349107f68aef48a3ecbf4ada9
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: ai-native-1.95
      - name: Verify frozen base, reviewed paths and patch digest; apply working tree only
        env:
          CANDIDATE: ${{ inputs.candidate }}
          MODE: candidate
          BASE: ${{ inputs.base }}
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
          TESTS_PATCH_BASE64: ${{ inputs.tests_patch_base64 }}
          TESTS_PATCH_SHA256: ${{ inputs.tests_patch_sha256 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          EXPECTED = {'markdown': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/markdown.rs', 'docs/okf.md'], 'tests_paths': ['crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/markdown.rs'], 'candidate_sha256': '532499c7f04df69f458fc8931b99bd35a6e22873439c0b345294463551e71714', 'tests_sha256': 'f955747f2efe1672a03aff99a9c3b53b2ab3581e1d46cfc89e52b96c6dce08ff', 'candidate_bytes': 9036, 'tests_bytes': 4973}, 'atomic-download': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-cli/src/http_client.rs', 'crates/ai-memory-cli/tests/suite/main.rs', 'docs/okf.md', 'crates/ai-memory-cli/tests/suite/backup_download.rs'], 'tests_paths': ['crates/ai-memory-cli/tests/suite/main.rs', 'crates/ai-memory-cli/tests/suite/backup_download.rs'], 'candidate_sha256': 'd2090a61d6e893c118819d64e40a82ed6e1f9d9ec4d54acaf316f4bc870b9e32', 'tests_sha256': '756fbf69a8f122062e1f42d21510bbc05e99cf7fcb10664e9e40ab0f4718d5f4', 'candidate_bytes': 19648, 'tests_bytes': 11317}, 'percent-destination': {'base': '3334785675d8e56349107f68aef48a3ecbf4ada9', 'paths': ['CHANGELOG.md', 'crates/ai-memory-web/src/markdown.rs', 'crates/ai-memory-web/tests/suite/routes.rs', 'crates/ai-memory-wiki/src/lib.rs', 'crates/ai-memory-wiki/src/markdown.rs', 'docs/okf.md', 'docs/security-boundaries.md'], 'tests_paths': ['crates/ai-memory-web/src/markdown.rs', 'crates/ai-memory-web/tests/suite/routes.rs', 'crates/ai-memory-wiki/src/markdown.rs'], 'candidate_sha256': 'a01699b282768ca820eca3e8623eb7cd7a3dd4eafe6984131b3295b9b3f9fa48', 'tests_sha256': '456e98a69c75512069a7bf477bb7d796bfd2475313e96b510dcce5d2a10047a4', 'candidate_bytes': 27225, 'tests_bytes': 8759}}
          name=os.environ['CANDIDATE']; mode=os.environ['MODE']; expected=EXPECTED[name]
          assert os.environ['BASE']==expected['base'], 'base input mismatch'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==expected['base'], 'checkout revision mismatch'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip(), 'checkout not clean'
          key='tests_sha256' if mode=='baseline' else 'candidate_sha256'
          supplied=os.environ['TESTS_PATCH_SHA256' if mode=='baseline' else 'PATCH_SHA256']
          encoded=os.environ['TESTS_PATCH_BASE64' if mode=='baseline' else 'PATCH_BASE64']
          assert supplied==expected[key], 'unreviewed patch digest'
          patch=base64.b64decode(encoded,validate=True)
          assert len(patch)<=65536 and hashlib.sha256(patch).hexdigest()==expected[key], 'patch integrity mismatch'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)
          f=root/'applied.patch';f.write_bytes(patch)
          stat=subprocess.check_output(['git','apply','--numstat',str(f)],text=True)
          paths=[line.split('\t',2)[2]for line in stat.splitlines()]
          allowed=expected['tests_paths' if mode=='baseline' else 'paths']
          assert paths and len(paths)==len(set(paths))and set(paths)==set(allowed), 'path allowlist mismatch'
          assert all(not pathlib.PurePosixPath(p).is_absolute()and '..'not in pathlib.PurePosixPath(p).parts for p in paths)
          subprocess.run(['git','apply','--check',str(f)],check=True)
          subprocess.run(['git','apply',str(f)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          metadata={'candidate':name,'mode':mode,'base':head,'patch_sha256':expected[key],'paths':paths,'source_commit_pushed':False,'platform':'ubuntu-latest','rust':'1.95','workflow_commit':os.environ['GITHUB_SHA']}
          (root/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Record native compiler and resource budget
        run: |
          rustc --version
          cargo --version
          rustc --version | grep '^rustc 1.95.'
          df -h .
      - name: Formatting
        env:
          QUALIFICATION_COMMAND: 'cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/ai-memory-qualification/formatting.log"'
        run: |
          python3 - <<'PY'
          import os
          for key in list(os.environ):
           if key in {'GITHUB_TOKEN','GH_TOKEN'}or key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_')):
            os.environ.pop(key,None)
          os.execvp('bash',['bash','-euo','pipefail','-c',os.environ['QUALIFICATION_COMMAND']])
          PY
      - name: Clippy
        env:
          QUALIFICATION_COMMAND: 'cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/ai-memory-qualification/clippy.log"'
        run: |
          python3 - <<'PY'
          import os
          for key in list(os.environ):
           if key in {'GITHUB_TOKEN','GH_TOKEN'}or key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_')):
            os.environ.pop(key,None)
          os.execvp('bash',['bash','-euo','pipefail','-c',os.environ['QUALIFICATION_COMMAND']])
          PY
      - name: All workspace and target tests
        env:
          QUALIFICATION_COMMAND: 'cargo test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/ai-memory-qualification/all-workspace-and-target-tests.log"'
        run: |
          python3 - <<'PY'
          import os
          for key in list(os.environ):
           if key in {'GITHUB_TOKEN','GH_TOKEN'}or key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_')):
            os.environ.pop(key,None)
          os.execvp('bash',['bash','-euo','pipefail','-c',os.environ['QUALIFICATION_COMMAND']])
          PY
      - name: Doctests
        env:
          QUALIFICATION_COMMAND: 'cargo test --locked --workspace --doc 2>&1 | tee "$RUNNER_TEMP/ai-memory-qualification/doctests.log"'
        run: |
          python3 - <<'PY'
          import os
          for key in list(os.environ):
           if key in {'GITHUB_TOKEN','GH_TOKEN'}or key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_')):
            os.environ.pop(key,None)
          os.execvp('bash',['bash','-euo','pipefail','-c',os.environ['QUALIFICATION_COMMAND']])
          PY
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          log-level: warn
          command: check
          arguments: --all-features
      - name: Require native guard-removal failures and restore candidate
        if: inputs.candidate == 'percent-destination'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'
          wiki=pathlib.Path('crates/ai-memory-wiki/src/markdown.rs');web=pathlib.Path('crates/ai-memory-web/src/markdown.rs')
          wiki_test=['cargo','test','--locked','-p','ai-memory-wiki','decoded_markdown_paths_cannot_escape_or_change_scope','--','--nocapture']
          web_test=['cargo','test','--locked','-p','ai-memory-web','decoded_markdown_destinations_cannot_change_the_web_scope','--','--nocapture']
          ws=wiki.read_text();ss=web.read_text();start=ss.index('    if decoded_path.is_empty()');end=ss.index('    let mut path_part =',start)
          cases=[
           ('encoded-controls',wiki,'if byte.is_ascii_control() {','if false {',wiki_test),
           ('invalid-utf8',wiki,'String::from_utf8(decoded).ok().map(std::borrow::Cow::Owned)','Some(std::borrow::Cow::Owned(String::from_utf8_lossy(&decoded).into_owned()))',wiki_test),
           ('root-traversal',wiki,'parts.pop()?;','parts.pop();',wiki_test),
           ('decoded-web-guard',web,ss[start:end],'',web_test),
          ]
          results=[]
          child_env={key:value for key,value in os.environ.items()if key not in {'GITHUB_TOKEN','GH_TOKEN'}and not key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}
          for name,file,old,new,cmd in cases:
           original=file.read_bytes();text=original.decode();assert text.count(old)==1,(name,'mutation is not unique')
           try:
            file.write_text(text.replace(old,new,1));r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=300,env=child_env);(root/('bite-'+name+'.log')).write_text(r.stdout);print(r.stdout)
            assert r.returncode==101 and 'test result: FAILED'in r.stdout and 'panicked at'in r.stdout,'guard removal must fail a native assertion'
            assert 'could not compile'not in r.stdout and 'error[E'not in r.stdout,'compile failure is not guard evidence'
            results.append({'guard':name,'exit':r.returncode,'assertion_failure':True,'source':str(file)})
           finally:file.write_bytes(original)
          (root/'guard-bites.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Verify whitespace and final patch identity including new files
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          subprocess.run(['git','diff','--check'],check=True)
          canonical=subprocess.check_output(['git','diff','--binary'])
          for file in subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines():
              result=subprocess.run(['git','diff','--no-index','--binary','--','/dev/null',file],capture_output=True)
              assert result.returncode==1, 'failed to inspect new file'
              canonical+=result.stdout
          actual=hashlib.sha256(canonical).hexdigest()
          assert actual==os.environ['EXPECTED_SHA256'], 'qualification mutated the reviewed patch'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'
          (root/'final-patch-identity.json').write_text(json.dumps({'sha256':actual,'including_untracked_files':True},indent=2)+chr(10))
          print('Final reviewed patch SHA-256:',actual)
          PY
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.candidate }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-memory-qualification/
          if-no-files-found: error
          retention-days: 14
